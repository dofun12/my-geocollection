version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: geocollection-postgres
    environment:
      POSTGRES_DB: geocollection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geocollection-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geocollection-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: geocollection
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:80
    ports:
      - "8080:8080"
    networks:
      - geocollection-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
  # Frontend (Optional - for production deployment)
  # Uncomment this if you want to serve the frontend via Docker as well
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.frontend
  #   container_name: geocollection-frontend
  #   ports:
  #     - "3000:80"
  #   networks:
  #     - geocollection-network
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

networks:
  geocollection-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

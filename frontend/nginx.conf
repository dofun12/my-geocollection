# Rate limit zone: 10MB shared memory, 5 requests per second
limit_req_zone $binary_remote_addr zone=photon_limit:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://geocollection-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Photon Geocoder requests with rate limiting
    location /photon/ {
        # Apply rate limit: 5r/s with a burst of 10 (nodelay)
        limit_req zone=photon_limit burst=10 nodelay;

        # Rewrite /photon/api/... to /api/...
        rewrite ^/photon/(.*) /$1 break;

        # Proxy to the local Photon container
        proxy_pass https://photon.komoot.io;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: Proxy Actuator endpoint if needed (or protect it)
    location /actuator/ {
        proxy_pass http://geocollection-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
